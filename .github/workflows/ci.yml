name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Tailwind CSS & Run Tests
        run: |
          bundle exec rails db:prepare
          bundle exec rails tailwindcss:build
          bundle exec rails test

      - name: Run RuboCop
        run: bundle exec rubocop
